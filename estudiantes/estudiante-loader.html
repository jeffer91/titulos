<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Cargando módulo de estudiantes…</title>
  <style>
    html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#071b34;color:#fff}
    body{display:grid;place-items:center;padding:24px}
    .box{max-width:520px;text-align:center}.spinner{width:44px;height:44px;margin:0 auto 18px;border:5px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
    p{color:#d8e4f2;line-height:1.5}
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Cargando Titulación</h1>
    <p>Preparando la versión más reciente del módulo de estudiantes.</p>
  </div>

  <script>
    (function () {
      'use strict';
      var BUILD = '20261006-19';
      var url = 'estudiante.html?build=' + encodeURIComponent(BUILD) + '&cb=' + Date.now();

      fetch(url, {
        cache: 'no-store',
        credentials: 'same-origin',
        headers: { 'Cache-Control': 'no-cache' }
      })
        .then(function (response) {
          if (!response.ok) throw new Error('No se pudo cargar el módulo.');
          return response.text();
        })
        .then(function (html) {
          html = html.replace(/\.\.\/assets\/img\/logo-itsqmet\.png/g, 'assets/logo-instituto.png');

          html = html.replace(/(src|href)="((?:js|css)\/[^"?]+\.(?:js|css))(?:\?[^\"]*)?"/g, function (_, attr, path) {
            return attr + '=\"' + path + '?v=' + BUILD + '\"';
          });

          html = html.replace(/<script\s+src="js\/estudiante\.app\.js[^\"]*"><\/script>/i,
            '<script src="js/estudiante.app.js?v=' + BUILD + '"><\/script>');

          html = html.replace('</body>',
            '<script src="js/seguimiento.premium.js?v=' + BUILD + '"><\/script></body>');

          document.open();
          document.write(html);
          document.close();
        })
        .catch(function (error) {
          console.error('[Estudiantes] Error del cargador:', error);
          window.location.replace('estudiante.html?build=' + encodeURIComponent(BUILD) + '&cb=' + Date.now());
        });
    })();
  </script>
</body>
</html>
