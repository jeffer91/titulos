name: Publicar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Validar sintaxis JavaScript
        run: |
          find . -type f -name '*.js' \
            -not -path './node_modules/*' \
            -not -path './.git/*' \
            -print0 | xargs -0 -n1 node --check

      - name: Probar flujos críticos
        run: |
          node tests/consulta-estado.test.js
          node tests/estudiante-envio-rapido.test.js
          node tests/arquitectura-estudiantes.test.js
          node tests/arquitectura-coordinadores.test.js
          node tests/investigacion-cola.test.js
          node tests/auditoria-e2e.test.js
          node tests/administrador-faltantes.test.js
          node tests/reportes-revisiones.test.js

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar sitio estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Esperar disponibilidad del artefacto
        run: sleep 5

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
