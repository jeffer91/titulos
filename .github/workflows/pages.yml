name: Publicar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Validar sintaxis JavaScript
        run: |
          find . -type f -name '*.js' \
            -not -path './node_modules/*' \
            -not -path './.git/*' \
            -print0 | xargs -0 -n1 node --check

      - name: Comprobar la pantalla de mantenimiento estudiantil
        run: |
          if [ -f estudiantes/MANTENIMIENTO_ACTIVO ]; then
            node -e 'const fs=require("node:fs"); for(const file of ["estudiantes/estudiante.html","estudiantes/index.html","estudiantes/estudiante-loader.html"]){const html=fs.readFileSync(file,"utf8"); if(!html.includes("Página en construcción") || /<(?:form|input|button|script|a)\b/i.test(html)) throw Error(file+": debe mostrar solamente el aviso sin interacciones");} console.log("Portal estudiantil en mantenimiento: sin formularios, enlaces, botones ni scripts.");'
          fi

      - name: Probar flujos críticos
        continue-on-error: ${{ hashFiles('estudiantes/MANTENIMIENTO_ACTIVO') != '' }}
        run: |
          if [ -f estudiantes/MANTENIMIENTO_ACTIVO ]; then
            echo "Mantenimiento temporal: se registran todas las pruebas, pero la UI antigua no debe bloquear la publicación del aviso."
            set +e
          fi
          node --test tests/admin-workflow.test.js
          node tests/consulta-estado.test.js
          node tests/estudiante-envio-rapido.test.js
          node --test tests/estudiante-consulta-recuperacion.test.js
          if [ -f estudiantes/MANTENIMIENTO_ACTIVO ]; then
            echo "Portal estudiantil en mantenimiento: se omite únicamente la prueba de arquitectura de la UI activa."
          else
            node tests/arquitectura-estudiantes.test.js
          fi
          node tests/arquitectura-coordinadores.test.js
          node tests/arquitectura-investigadores.test.js
          node tests/arquitectura-administrador.test.js
          node tests/investigacion-cola.test.js
          node --test tests/flujo-ronda-vigente.test.js
          node --test tests/investigacion-transaccion.test.js
          node --test tests/investigacion-coordinacion-vista.test.js
          node tests/auditoria-e2e.test.js
          node --test tests/coordinacion-consistencia.test.js
          node --test tests/expediente-vigente.test.js
          node --test tests/estudiante-reenvio.test.js
          node tests/administrador-faltantes.test.js
          node --test tests/administrador-cache-estadisticas.test.js
          node --test tests/administrador-excel.test.js
          node --test tests/comunicaciones-administrador.test.js
          node tests/reportes-revisiones.test.js

      - name: Probar aislamiento y permisos de los cuatro backends
        run: node --test functions/test/*.test.js

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Aislar sitio público del backend y credenciales
        run: |
          mkdir -p .site
          rsync -a ./ .site/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.site/' \
            --exclude='functions/' \
            --exclude='tests/' \
            --exclude='node_modules/' \
            --exclude='.env*' \
            --exclude='*service-account*.json' \
            --exclude='*service_account*.json' \
            --exclude='*adminsdk*.json' \
            --exclude='*.pem' \
            --exclude='*.p12' \
            --exclude='*.key' \
            --exclude='firebase.json'

      - name: Preparar sitio estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: .site

      - name: Esperar disponibilidad del artefacto
        run: sleep 5

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
